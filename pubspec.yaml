# pubspec.yaml
name: shri_amman_clinic
description: A Flutter web app for clinic management.
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  pdf: ^3.10.0
  printing: ^5.10.0
  qr_flutter: ^4.0.0
  barcode_widget: ^2.0.0
  shared_preferences: ^2.0.0
  go_router: ^7.0.0
  intl: ^0.18.0
  url_strategy: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
